<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЄДКІ. Право: тренажер</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ЄДКІ">
<meta name="theme-color" content="#1D5C46">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F2; --surface:#FFFFFF; --ink:#14201B; --muted:#5B6862; --line:#D8DED9;
  --green:#1D5C46; --green-ink:#FFFFFF; --green-soft:#E1EEE8;
  --brass:#8F6610; --brass-soft:#F3EAD3;
  --brick:#A93A2E; --brick-soft:#F6E3E0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1512; --surface:#16211C; --ink:#E7EEE9; --muted:#9AA9A1; --line:#27352E;
    --green:#5DB690; --green-ink:#08150F; --green-soft:#17332A;
    --brass:#D4A64A; --brass-soft:#2B2312;
    --brick:#E0786C; --brick-soft:#33191A;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1512; --surface:#16211C; --ink:#E7EEE9; --muted:#9AA9A1; --line:#27352E;
  --green:#5DB690; --green-ink:#08150F; --green-soft:#17332A;
  --brass:#D4A64A; --brass-soft:#2B2312;
  --brick:#E0786C; --brick-soft:#33191A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
.serif{font-family:Literata,Georgia,"Times New Roman",serif}
.app{max-width:560px;margin:0 auto;padding:22px 18px 110px}
h1{font-family:Literata,Georgia,serif;font-weight:600;font-size:30px;line-height:1.15;margin:6px 0 6px;letter-spacing:-.01em}
h2{font-family:Literata,Georgia,serif;font-weight:600;font-size:20px;line-height:1.25;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 20px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--green);font-weight:600}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:12px 18px;border-radius:14px;border:1.5px solid var(--green);background:var(--green);color:var(--green-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--green)}
.btn.plain{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:500}
.btn.danger{background:transparent;border-color:var(--brick);color:var(--brick)}
.btn[disabled]{opacity:.45;cursor:default}
.stack{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 16px;align-items:center}
.item:first-child{border-top:0}
.item .t{font-weight:500}
.item .n{color:var(--muted);font-size:14px}
.bar{grid-column:1 / -1;height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.pct{font-weight:600;color:var(--green);font-variant-numeric:tabular-nums}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:Literata,Georgia,serif;font-size:24px;line-height:1.1;font-weight:600}
.stat span{color:var(--muted);font-size:13px}
.count{background:var(--brass-soft);border-left:3px solid var(--brass);border-radius:6px;padding:12px 14px;margin:14px 0}
.count b{font-family:Literata,Georgia,serif;font-size:22px}

/* quiz */
.qtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.qbar{max-width:560px;margin:0 auto;padding:8px 12px;display:grid;grid-template-columns:44px 1fr auto 44px;align-items:center;gap:6px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed="true"]{color:var(--brass)}
.iconbtn[aria-pressed="true"] svg{fill:currentColor}
.qcount{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:600;padding:0 6px}
.timer.low{color:var(--brick)}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--green)}
.qwrap{max-width:560px;margin:0 auto;padding:18px 18px 150px}
.sec{color:var(--muted);font-size:14px;margin-bottom:8px}
.fabula{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:6px;padding:12px 14px;margin:0 0 16px;font-size:15px}
.fabula b{display:block;margin-bottom:4px}
.qtext{font-family:Literata,Georgia,serif;font-size:20px;line-height:1.4;margin:0 0 8px;font-weight:400}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.opt .l{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--muted)}
.opt.sel{border-color:var(--green);background:var(--green-soft)}
.opt.sel .l{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ok .l{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.opt.bad{border-color:var(--brick);background:var(--brick-soft)}
.opt.bad .l{background:var(--brick);border-color:var(--brick);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--green)}
.opt[disabled]{cursor:default}
.seq{display:grid;gap:8px;margin-bottom:14px}
.seqitem{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;width:100%;background:var(--green-soft);border:1.5px solid var(--green);border-radius:14px;padding:11px 14px}
.seqitem .l{width:28px;height:28px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-weight:600;font-size:14px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:14px;color:var(--muted);font-size:14px;text-align:center}
.pool{display:grid;gap:8px}
.pool .opt{grid-template-columns:1fr}
.mrow{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.mrow.ok{border-color:var(--green);background:var(--green-soft)}
.mrow.bad{border-color:var(--brick);background:var(--brick-soft)}
.mrow p{margin:0 0 8px;font-weight:500}
.mrow select{width:100%;min-height:44px;font-size:16px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper)}
.mrow .right{margin-top:8px;font-size:14px;color:var(--muted)}
.verdict{margin:20px 0 10px;font-weight:600;font-size:18px}
.verdict.ok{color:var(--green)}
.verdict.bad{color:var(--brick)}
.expl{margin:0 0 12px}
.norm{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:15px}
.norm b{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:4px}
.norm p{margin:0;font-family:Literata,Georgia,serif}
.basis{background:var(--brass-soft);border-left:3px solid var(--brass);border-radius:6px;padding:10px 14px;font-size:14px}
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:15}
.actions .in{max-width:560px;margin:0 auto;display:grid;gap:10px;grid-auto-flow:column;grid-auto-columns:1fr}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,16,13,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.sheet h3{font-family:Literata,Georgia,serif;font-size:20px;margin:0 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.cell{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.cell.done{background:var(--green-soft);border-color:var(--green)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.fl{border-color:var(--brass);box-shadow:inset 0 -4px 0 var(--brass)}

/* result */
.big{font-family:Literata,Georgia,serif;font-size:64px;line-height:1;font-weight:600;margin:10px 0 4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--green-ink);font-weight:600}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
a{color:var(--green)}
@media (prefers-reduced-motion:no-preference){.bar i,.prog i{transition:width .25s}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<noscript>Для роботи тренажера потрібен JavaScript.</noscript>
<script>
"use strict";
/* ===================== Дані ===================== */

  {id:"ihl", name:"Міжнародне гуманітарне право. Міжнародне кримінальне право"},

const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));

const CLUSTERS = {
  A: "Ірина уклала з ТОВ «Новий обрій» договір купівлі-продажу майнових прав на квартиру в будинку, що будується, і повністю сплатила ціну. Згодом забудовник в односторонньому порядку «розірвав» договір, послався на прострочення оплати (якого не було) і продав ті самі майнові права Олегові. Олег уклав договір із Максимом. Після введення будинку в експлуатацію право власності на квартиру зареєстровано за Максимом, який заплатив за неї ринкову ціну.",
  B: "Близько 22:00 в понеділок патрульні застали Д. під час таємного викрадення товару з магазину (діяння, за яке передбачено покарання у виді позбавлення волі). Д. затримали о 22:30 без ухвали слідчого судді. Припустіть, що спеціальні правила воєнного стану щодо строків затримання не застосовуються.",
  C: "У 2020 році Олена купила у Львові квартиру за нотаріально посвідченим договором, і право власності було зареєстроване за нею в Державному реєстрі речових прав на нерухоме майно. Олена тривалий час працювала за кордоном, а квартира стояла порожньою. У 2023 році державний реєстратор на підставі підробленого договору дарування, який Олена нібито уклала, зареєстрував право власності на квартиру за Марком. У 2024 році Марк за оплатним договором продав квартиру Наталії. Наталія заплатила ринкову ціну, перевірила відомості Реєстру, де власником значився Марк, і вселилась у квартиру. У травні 2026 року Олена повернулась в Україну і дізналась, що власником є Наталія. Олена хоче повернути квартиру. Наталія заперечує і заявляє про застосування позовної давності.",
  D: "Комунальне підприємство «Міськзелень» (засновник — міська рада) у січні 2026 року скоротило штатну посаду інженера Т. і звільнило її за п. 1 ст. 40 КЗпП. Наказ вручено Т. в день звільнення. Про наступне вивільнення Т. заздалегідь персонально не попереджали, іншої роботи не пропонували. Т. вважає звільнення незаконним і хоче бути поновленою на роботі. Окрім того, Т. звернулась до міської ради з інформаційним запитом про кошторис витрат на оптимізацію підприємства. Міська рада відмовила, пославшись на те, що така інформація не є публічною. Т. має намір оскаржити відмову в суді. Припустіть, що спеціальні правила воєнного стану щодо звільнення не застосовуються.",
  E: "Підозрюваного Ю. затримали за підозрою у вчиненні умисного вбивства. Слідчий розпочав допит Ю. без роз’яснення йому права на захисника, і Ю. зізнався. Адвоката Я., який прибув до відділу поліції за дорученням родини Ю., слідчий не допустив до Ю. протягом п’яти годин. Згодом слідчий суддя за клопотанням прокурора обрав щодо Ю. запобіжний захід у вигляді тримання під вартою. Ю. вважає, що його права порушено, і має намір після вичерпання національних засобів захисту звернутися до ЄСПЛ."
};
const CTITLE = {
  A: "Подвійний продаж майнових прав",
  B: "Затримання без ухвали слідчого судді",
  C: "Реєстраційне шахрайство з квартирою",
  D: "Скорочення на комунальному підприємстві",
  E: "Допит без захисника"
};

const S = (id,s,q,o,a,e,b,c) => ({id,s,t:"single",q,o,a:[a],e,b,c});
const M = (id,s,q,o,a,e,b,c) => ({id,s,t:"multi",q,o,a,e,b,c});
const O = (id,s,q,o,e,b,c) => ({id,s,t:"order",q,o,e,b,c});
const X = (id,s,q,p,e,b,c) => ({id,s,t:"match",q,p,e,b,c});

const Q = [
/* ---- Конституційне право ---- */
S("kon1","kon","Що Конституція України передбачає щодо внесення змін до неї в умовах воєнного або надзвичайного стану?",
 ["Зміни можна вносити лише за рішенням Президента","Конституція не може бути змінена","Зміни можна вносити без всеукраїнського референдуму","Зміни можна вносити лише до розділу про права людини"],1,
 "Стаття 157 забороняє змінювати Конституцію в умовах воєнного чи надзвичайного стану. Окремо заборонені зміни, що скасовують або обмежують права і свободи людини чи спрямовані на ліквідацію незалежності або порушення територіальної цілісності.","Ст. 157 Конституції України"),
S("kon2","kon","Яке з перелічених прав не може бути обмежене в умовах воєнного стану?",
 ["Свобода пересування (ст. 33)","Право на мирні зібрання (ст. 39)","Право на життя (ст. 27)","Право на підприємницьку діяльність (ст. 42)"],2,
 "Частина друга ст. 64 містить перелік прав, які не можуть бути обмежені, зокрема ст. 27 (право на життя), ст. 28 і ст. 29. Свобода пересування, мирні зібрання та підприємництво можуть обмежуватися із зазначенням строку дії обмежень.","Ст. 64 Конституції України"),
S("kon3","kon","Із якого віку громадянин України може бути обраний Президентом України?",

 "Президентом може бути обраний громадянин, який досяг 35 років, має право голосу, проживає в Україні протягом десяти останніх перед виборами років і володіє державною мовою.","Ст. 103 Конституції України"),
M("kon4","kon","Хто призначає суддів Конституційного Суду України? Оберіть три правильні відповіді.",
 ["Президент України","Верховна Рада України","З’їзд суддів України","Кабінет Міністрів України","Вища рада правосуддя","Верховний Суд","Конституційна комісія"],[0,1,2],
 "Конституційний Суд складається з 18 суддів: по шість призначають Президент, Верховна Рада і З’їзд суддів України.","Ст. 148 Конституції України"),

S("gkon1","kon","Остаточне судове рішення у справі особи набрало законної сили 10 березня. До якої дати вона може подати конституційну скаргу, що оскаржує закон, застосований у цьому рішенні?",

S("gkon3","kon","Виконавчий комітет міської ради заборонив мирний мітинг, про який організатори повідомили за п’ять днів, послався на ймовірність провокацій. Чи правомірне таке рішення?",

S("gasu3","asu","Орган влади протиправно відмовив особі у призначенні соціальної виплати, не розглянувши по суті її заяву. Яку вимогу найдоцільніше заявити в адміністративному позові, щоб права було відновлено?",
 ["Визнати відмову протиправною і зобов’язати орган розглянути заяву та ухвалити рішення","Визнати право власності на виплату","Стягнути з органу моральну шкоду без оскарження відмови","Скасувати закон, на підставі якого діяв орган"],0,
 "Серед способів захисту КАС називає визнання протиправним і скасування акта та зобов’язання відповідача вчинити певні дії. Скасування закону належить до компетенції Конституційного Суду.","Ст. 5, 245 КАС України"),

/* ---- Цивільне право ---- */
S("gciv1","civ","Суд визнав недійсним договір купівлі-продажу автомобіля між Петренком і Мороз. Автомобіль перебуває у Мороз, гроші у Петренка. Який основний наслідок недійсності правочину?",
 ["Правочин залишається чинним до зміни законодавства","Кожна сторона зобов’язана повернути іншій у натурі все, що одержала за правочином","Лише продавець повертає майно, а гроші залишаються в нього як відшкодування","Обидві сторони звільняються від будь-яких обов’язків без повернення"],1,
 "Недійсний правочин не створює юридичних наслідків, крім пов’язаних з його недійсністю. Основним наслідком є двостороння реституція, а якщо повернути в натурі неможливо, відшкодовується вартість.","Ст. 216 ЦК України"),
S("gciv2","civ","Покупець і продавець у простій письмовій формі домовилися про всі істотні умови договору купівлі-продажу квартири. Покупець повністю сплатив ціну, але продавець ухиляється від нотаріального посвідчення. Яку вимогу доцільно пред’явити покупцеві?",
 ["Про визнання договору нікчемним","Про визнання договору дійсним","Про витребування квартири з чужого незаконного володіння","Про розірвання договору та повернення коштів у будь-якому разі"],1,
 "Якщо одна зі сторін ухиляється від нотаріального посвідчення, суд за наявності виконання договору іншою стороною може визнати його дійсним, і тоді наступне нотаріальне посвідчення не вимагається. Віндикація тут неприйнятна, бо між сторонами є договірні відносини.","Ч. 2 ст. 220 ЦК України"),
S("gciv3","civ","Договір найму автомобіля припинився зі спливом строку, наймач не повернув річ і далі нею користується. Власник пред’явив віндикаційний позов. Чи належний спосіб захисту?",
 ["Так, бо наймач незаконно володіє автомобілем","Так, але лише якщо договір розірвано судом","Ні, належною є вимога про повернення речі, що випливає з договору найму","Ні, належним є негаторний позов"],2,
 "Коли між сторонами є договір, їхні права захищаються нормами зобов’язального права. Після припинення найму наймач зобов’язаний повернути річ, а віндикація призначена для захисту від особи, у якої немає договірної підстави володіння відносно власника.","Ст. 785 ЦК України"),
S("gciv4","civ","Боржник прострочив виплату 100 000 грн за договором позики, у договорі інший розмір відповідальності не встановлено. Що кредитор може додатково вимагати за ст. 625 ЦК?",
 ["Лише суму основного боргу","Суму боргу з індексом інфляції та три проценти річних від простроченої суми","Подвійну суму боргу","Лише відшкодування збитків без інфляційних втрат"],1,
 "Боржник, який прострочив виконання грошового зобов’язання, на вимогу кредитора зобов’язаний сплатити суму боргу з урахуванням індексу інфляції та три проценти річних, якщо інший розмір не встановлений договором або законом.","Ст. 625 ЦК України"),
S("gciv5","civ","Внаслідок ДТП пошкоджено автомобіль потерпілого. Водій заперечує вину. Хто має довести відсутність вини?",
 ["Потерпілий, бо він посилається на завдання шкоди","Особа, яка завдала шкоди, бо вина презюмується","Суд зобов’язаний самостійно встановити вину","Страхова компанія потерпілого"],1,
 "У деліктних зобов’язаннях діє презумпція вини: особа, яка завдала шкоди, звільняється від відшкодування, лише якщо доведе, що шкоди завдано не з її вини.","Ст. 1166 ЦК України"),
S("gciv6","civ","Працівник ТОВ, керуючи автомобілем компанії, завдав шкоди пішоходу. Хто відшкодовує шкоду, завдану джерелом підвищеної небезпеки?",
 ["Лише працівник особисто","Особа, яка на відповідній правовій підставі володіє автомобілем, тобто ТОВ","Лише страхова компанія за будь-яких умов","Держава через уповноважений орган"],1,
 "Шкоду, завдану джерелом підвищеної небезпеки, відшкодовує особа, яка на відповідній правовій підставі володіє транспортним засобом. Це не залежить від того, що безпосередньо керував інший працівник.","Ст. 1187 ЦК України"),
S("gciv7","civ","Платник помилково двічі переказав одну суму одержувачу без договору, який би це передбачав. На якій підставі він може вимагати повернення зайвої суми?",
 ["Як відшкодування шкоди за ст. 1166","Як безпідставно набуте майно за ст. 1212","Як віндикацію за ст. 387","Як усунення перешкод за ст. 391"],1,
 "Особа, яка набула майно за рахунок іншої без достатньої правової підстави, зобов’язана повернути його потерпілому. Це кондикційне зобов’язання.","Ст. 1212 ЦК України"),
S("gciv8","civ","Заповідач склав заповіт на користь стороннього товариства, не згадавши про неповнолітнього сина. Яке право має син щодо спадщини?",
 ["Жодного, бо заповіт є вичерпним","Право на обов’язкову частку","Право на всю спадщину, оскільки він неповнолітній","Право лише на пенсійне забезпечення"],1,
 "Неповнолітні та інші особи, названі в ст. 1241, спадкують незалежно від змісту заповіту половину частки, яка належала б кожному з них у разі спадкування за законом.","Ст. 1241 ЦК України"),
S("gciv9","civ","Письменник створив роман, але не реєстрував його ніде. Чи виникло в нього авторське право?",
 ["Ні, право виникає лише після державної реєстрації","Так, право виникає з моменту створення твору","Ні, потрібне нотаріальне посвідчення","Так, але лише після публікації тиражем"],1,
 "Авторське право виникає внаслідок факту створення твору, і для його виникнення не вимагається жодних формальностей. Реєстрація має лише доказове значення.","Глава 36 ЦК України; Закон «Про авторське право і суміжні права»"),

S("gcpp1","cpp","Адвокат подає до суду позовну заяву від імені клієнта. Чим підтверджуються його повноваження як представника?",
 ["Лише посвідченням адвоката","Довіреністю або ордером","Рішенням ради адвокатів","Згодою голови суду"],1,
 "Повноваження адвоката як представника підтверджуються довіреністю або ордером, або дорученням органу, уповноваженого на надання безоплатної правничої допомоги.","Ст. 62 ЦПК України"),
S("gcpp2","cpp","Працівник вимагає стягнути нараховану, але не виплачену йому заробітну плату за останні два місяці. В якому провадженні може бути розглянута така вимога?",
 ["Лише в загальному позовному провадженні","У наказному провадженні","В окремому провадженні","В адміністративному судочинстві"],1,
 "Судовий наказ може бути видано за вимогою про стягнення нарахованої, але не виплаченої працівникові заробітної плати. Спір про право, що потребує дослідження доказів, у наказному провадженні не розглядається.","Ст. 161 ЦПК України"),
S("gcpp3","cpp","Родичі просять суд визнати особу недієздатною через психічний розлад. В якому провадженні розглядається така справа?",
 ["У позовному провадженні загальному","У наказному провадженні","В окремому провадженні","У спрощеному позовному провадженні"],2,
 "Справи про обмеження цивільної дієздатності фізичної особи та визнання її недієздатною належать до окремого провадження, де немає спору про право і сторін у позовному розумінні.","Ст. 293 ЦПК України"),
S("gcpp4","cpp","Яка з підстав дає право на перегляд судового рішення в цивільній справі за виключними обставинами?",
 ["Нововиявлені обставини, які не були відомі заявникові","Встановлення ЄСПЛ порушення Україною міжнародних зобов’язань при вирішенні справи судом","Незгода сторони з оцінкою доказів судом","Пропуск строку апеляційного оскарження з поважної причини"],1,
 "До виключних обставин належить, зокрема, встановлення міжнародною судовою установою, юрисдикцію якої визнала Україна, порушення міжнародних зобов’язань при вирішенні справи судом. Нововиявлені обставини є окремою підставою.","Ст. 423 ЦПК України"),
S("gcpp5","cpp","Суд ухвалив заочне рішення за відсутності відповідача. Протягом якого строку відповідач може подати заяву про його перегляд?",
 ["П’ятнадцяти днів з дня отримання","Тридцяти днів з дня проголошення рішення","Трьох місяців з дня ухвалення","Одного року"],1,
 "Заяву про перегляд заочного рішення може бути подано протягом тридцяти днів з дня його проголошення, а якщо відповідач не був присутній, то з дня отримання копії.","Ст. 284 ЦПК України"),

S("glab1","lab","Працівник працював у зміну з 20:00 до 02:00. Який період вважається нічним часом за КЗпП?",
 ["З 20:00 до 06:00","З 22:00 до 06:00","З 23:00 до 07:00","З 21:00 до 05:00"],1,
 "Нічним вважається час з десятої години вечора до шостої години ранку. Робота в цей час має особливості оплати та тривалості.","Ст. 54 КЗпП України"),
S("glab2","lab","Працівника залучено до роботи у святковий день без надання іншого дня відпочинку. Як має оплачуватися така робота?",
 ["У звичайному розмірі","У подвійному розмірі","У півторному розмірі","Лише надбавкою 20% до ставки"],1,
 "Робота у святковий і неробочий день оплачується у подвійному розмірі. Працівник за його бажанням може отримати інший день відпочинку, але оплата за законом визначається цією статтею.","Ст. 107 КЗпП України"),
S("glab3","lab","Через несправність обладнання підприємство простоювало тиждень. Простій стався не з вини працівника. Яка мінімальна оплата за цей час?",
 ["Не нижче половини тарифної ставки","Не нижче двох третин тарифної ставки встановленого працівникові розряду","Повна заробітна плата без обмежень","Оплата за простій не передбачена"],1,
 "Час простою не з вини працівника оплачується з розрахунку не нижче двох третин тарифної ставки встановленого працівникові розряду (окладу).","Ст. 113 КЗпП України"),
S("glab4","lab","Водій необережно пошкодив автомобіль підприємства, спеціальної угоди про повну матеріальну відповідальність немає. У якому розмірі він несе матеріальну відповідальність за загальним правилом?",
 ["У розмірі повної вартості автомобіля","У розмірі прямої дійсної шкоди, але не більше середнього місячного заробітку","Лише в розмірі трьох місячних заробітків","Не несе відповідальності, бо дія необережна"],1,
 "Загальне правило КЗпП обмежена матеріальна відповідальність: у межах прямої дійсної шкоди, але не більше середньомісячного заробітку. Повна відповідальність можлива лише у випадках, передбачених законом або договором за законом.","Ст. 132, 134 КЗпП України"),
S("glab5","lab","Підприємство продовжує діяльність, але хоче звільнити працівницю, яка має дитину віком два роки, у зв’язку зі скороченням штату. Чи допускається це?",
 ["Так, за наявності пропозиції іншої роботи","Так, якщо профспілка погодила звільнення","Ні, звільнення з ініціативи роботодавця не допускається, крім випадків повної ліквідації підприємства","Так, якщо працівниця має меншу кваліфікацію"],2,
 "Жінок, які мають дітей віком до трьох років, не можна звільняти з ініціативи роботодавця, крім випадків повної ліквідації підприємства. Скорочення штату за збереження діяльності не є винятком.","Ст. 184 КЗпП України"),
S("glab6","lab","Роботодавець уклав з бухгалтером на постійній посаді трудовий договір на один рік, хоча характер роботи не обумовлює строкового договору. Чи правомірно?",
 ["Так, сторони вільні вибирати строк договору","Ні, строковий трудовий договір укладається лише у випадках, коли відносини не можуть бути встановлені на невизначений строк, та в інших випадках, передбачених законами","Так, якщо працівник не заперечує","Ні, строкові договори заборонені"],1,
 "За ст. 23 строковий договір допустимий лише в передбачених випадках: коли трудові відносини не можуть бути встановлені на невизначений строк з урахуванням характеру роботи, умов її виконання, інтересів працівника та в інших випадках, передбачених законодавчими актами.","Ст. 23 КЗпП України"),

S("gipp1","ipp","Громадянин Польщі помер, залишивши квартиру в Україні. Право якої держави за загальним правилом визначає спадкування цієї квартири?",
 ["Право Польщі як держави громадянства спадкодавця","Право держави місця смерті","Право України як держави місцезнаходження нерухомого майна","Право, яке обере суд на власний розсуд"],2,
 "Спадкування нерухомого майна регулюється правом держави, на території якої розташоване це майно, а рухомого майна, за загальним правилом, особистим законом спадкодавця на момент смерті.","Закон України «Про міжнародне приватне право» (спадкування)"),
S("gipp2","ipp","Громадянин Литви та громадянка України укладають шлюб в Україні. Право якої держави визначає форму укладення цього шлюбу?",
 ["Право Литви","Право України як держави місця укладення шлюбу","Право, яке обере нотаріус","Право держави, де сторони плануватимуть проживати"],1,
 "Форма шлюбу визначається правом держави місця його укладення, а умови укладення шлюбу для кожної особи особистим законом. Тому форму тут визначає право України.","Закон України «Про міжнародне приватне право» (шлюб)"),
S("gipp3","ipp","Сторони зовнішньоекономічного контракту включили умову FOB Одеса. Що регулюють правила Інкотермс?",

const WEIGHTS = {kon:5, eu:4, mpp:9, adm:7.5, asu:7.5, civ:13, cpp:9, lab:10, ipp:6, kk:9, kpk:8, ihl:7, eth:5};
function examPool(n){
  let target = n; const out = [];
  if (n >= 30){
    const ids = Object.keys(CTITLE), id = ids[Math.floor(Math.random() * ids.length)];
    const cq = Q.filter(q => q.c === id); out.push(...cq); target = n - cq.length;
  }
  const singles = Q.filter(q => !q.c);
  SECTIONS.forEach(sec => {
    const quota = Math.max(1, Math.round(target * WEIGHTS[sec.id] / 100));
    out.push(...shuffle(singles.filter(q => q.s === sec.id)).slice(0, quota));
  });
  return out;
}

    else if (k === "html") el.innerHTML = v;
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);

}

function prep(q){
  session.prep = session.prep || {};
  if (session.prep[q.id]) return session.prep[q.id];
  let P = {};
  if (q.t === "single" || q.t === "multi") P.opt = shuffle(q.o.map((_, i) => i));
  if (q.t === "order") P.pool = shuffle(q.o.map((_, i) => i));
  if (q.t === "match") P.rights = shuffle([...new Set(q.p.map(x => x[1]))]);
  return session.prep[q.id] = P;
}
function isCorrect(q, a){
  if (a == null) return false;
  if (q.t === "single") return a === q.a[0];
  if (q.t === "multi") return a.length === q.a.length && q.a.every(i => a.includes(i));
  if (q.t === "order") return a.length === q.o.length && a.every((v, i) => v === i);
  if (q.t === "match") return q.p.every((pr, i) => a[i] === pr[1]);
  return false;
}
function ready(q, a){
  if (a == null) return false;
  if (q.t === "single") return true;
  if (q.t === "multi") return a.length === q.a.length;
  if (q.t === "order") return a.length === q.o.length;
  if (q.t === "match") return q.p.every((_, i) => a[i]);
  return false;
}
const hasAns = q => { const a = session.answers[q.id]; return a != null && !(Array.isArray(a) && a.filter(Boolean).length === 0); };
function hintText(q){
  if (q.t === "single") return "Оберіть одну правильну відповідь.";
  if (q.t === "multi") return "Оберіть " + ({1:"одну",2:"дві",3:"три",4:"чотири"}[q.a.length] || q.a.length) + " правильні відповіді.";
  if (q.t === "order") return "Торкайтеся елементів у правильній послідовності. Торкніться вибраного, щоб прибрати.";
  return "Для кожного пункту оберіть відповідний варіант.";
}

let tab = "home", session = null, sheet = null, tick = null;

function units(list){
  const out = [], byC = {};
  list.forEach(q => {
    if (q.c){ if (!byC[q.c]){ byC[q.c] = []; out.push(byC[q.c]); } byC[q.c].push(q); }
    else out.push([q]);
  });
  return out;
}
function start({mode, title, pool, count}){
  let qs = [];
  for (const u of shuffle(units(pool))){ if (count && qs.length >= count) break; qs.push(...u); }
  if (!qs.length) return;
  session = {mode, title, qs, i:0, answers:{}, checked:{}, startedAt:Date.now(), prep:{}, done:false};
  if (mode === "exam"){
    session.limit = Math.round(qs.length * 90);
    session.endsAt = Date.now() + session.limit * 1000;
    tick = setInterval(onTick, 1000);
  }
  sheet = null; render(); window.scrollTo(0, 0);
}
function onTick(){
  if (!session || session.mode !== "exam" || session.done){ clearInterval(tick); return; }
  const left = Math.round((session.endsAt - Date.now()) / 1000);
  const el = document.getElementById("timer");
  if (el){ el.textContent = fmtTime(left); el.classList.toggle("low", left <= 300); }
  if (left <= 0) finish();
}
function checkNow(q){
  session.checked[q.id] = true;
  record(q, isCorrect(q, session.answers[q.id]));
  render();
}
function finish(){
  clearInterval(tick);
  const s = session;
  if (s.review) return leave();
  if (s.mode === "exam"){
    s.qs.forEach(q => record(q, hasAns(q) && isCorrect(q, s.answers[q.id])));
    const c = s.qs.filter(q => isCorrect(q, s.answers[q.id])).length;
    store.exams.unshift({t: Date.now(), n: s.qs.length, c, sec: Math.round((Date.now() - s.startedAt) / 1000)});
    store.exams = store.exams.slice(0, 20); save();
  }
  s.done = true; sheet = null; render(); window.scrollTo(0, 0);
}
function leave(){ clearInterval(tick); session = null; sheet = null; render(); window.scrollTo(0, 0); }
function score(s){
  const qs = s.qs, ok = qs.filter(q => isCorrect(q, s.answers[q.id]));
  const answered = qs.filter(q => s.mode === "exam" ? true : s.checked[q.id]);
  return {ok: ok.length, total: s.mode === "exam" ? qs.length : answered.length, wrong: qs.filter(q => !isCorrect(q, s.answers[q.id]) && (s.mode === "exam" || s.checked[q.id]))};
}

  const days = Math.ceil((EXAM_DATE - Date.now()) / 86400000);
  const wrong = wrongIds().length;
  let weak = null;
  SECTIONS.forEach(s => { const st = secStats(s.id); if (st.n >= 3 && (weak === null || st.acc < weak.acc)) weak = {id:s.id, acc:st.acc}; });
  return h("div", null,
    h("h1", null, "ЄДКІ. Право"),
    h("p", {class:"sub"}, "Тренажер для магістрів права. Розділи й типи завдань відповідають програмі іспиту."),
    days >= 0 ? h("div", {class:"count"}, h("b", null, days === 0 ? "Іспит сьогодні" : days + " " + (days % 10 === 1 && days % 100 !== 11 ? "день" : (days % 10 >= 2 && days % 10 <= 4 && (days % 100 < 10 || days % 100 >= 20)) ? "дні" : "днів")), h("div", {class:"small muted"}, "до основної сесії 12 листопада 2026 за графіком МОН. Дату перевіряйте на сайті МОН.")) : null,
    h("div", {class:"stats"},
      h("div", {class:"stat"}, h("b", null, String(done)), h("span", null, "питань пройдено")),
      h("div", {class:"stat"}, h("b", null, acc), h("span", null, "точність")),
      h("div", {class:"stat"}, h("b", null, String(Q.length)), h("span", null, "питань у базі"))),
    h("div", {class:"stack"},
      h("button", {class:"btn", on:{click:() => start({mode:"practice", title:"Мікс з усіх розділів", pool:Q, count:10})}}, "Почати: 10 питань з усіх розділів"),
      wrong ? h("button", {class:"btn ghost", on:{click:() => start({mode:"practice", title:"Мої помилки", pool:wrongIds().map(id => QBY[id])})}}, "Повторити помилки (" + wrong + ")") : null,
      weak ? h("button", {class:"btn plain", on:{click:() => start({mode:"practice", title:SEC[weak.id].name, pool:Q.filter(q => q.s === weak.id), count:10})}}, "Слабке місце: " + SEC[weak.id].name + " (" + weak.acc + "%)") : null),
    h("h2", null, "Формат іспиту"),
    h("p", {class:"muted", style:"margin:0"}, "Офіційно: 120 завдань за 180 хвилин. Завдання подаються кластерами (ситуаційна задача з кількома питаннями, часто з різних галузей права) або окремо і бувають чотирьох типів: одна правильна з чотирьох, три правильні із семи, послідовність і відповідність. Усі чотири типи і п’ять ситуаційних задач є в тренажері."));
}

function trainView(){
  const rows = SECTIONS.map(s => {
    const st = secStats(s.id);
    return h("button", {class:"item", on:{click:() => sectionSheet(s)}},
      h("span", {class:"t"}, s.name),
      h("span", {class:st.acc == null ? "n" : "pct"}, st.acc == null ? st.total + " " + pluralQ(st.total) : st.acc + "%"),
      st.acc != null ? h("span", {class:"n"}, st.seen + " із " + st.total + " пройдено") : null,
      h("div", {class:"bar"}, h("i", {style:"width:" + (st.total ? Math.round(st.seen / st.total * 100) : 0) + "%"})));
  });
  const w = wrongIds().length, f = flagIds().length;
  return h("div", null,
    h("h1", null, "Тренування"),
    h("p", {class:"sub"}, "Обирайте розділ. Після кожної відповіді видно пояснення і норму."),
    h("div", {class:"stack"},
      h("button", {class:"btn", on:{click:() => start({mode:"practice", title:"Усі розділи", pool:Q, count:20})}}, "Мікс: 20 питань"),
      h("button", {class:"btn ghost", on:{click:() => start({mode:"practice", title:"Сценарні тести за зразком", pool:Q.filter(q => q.g === "s2"), count:20})}}, "Сценарні тести: 20 із " + Q.filter(q => q.g === "s2").length),
      h("div", {class:"two"},
        h("button", {class:"btn plain", disabled: !w, on:{click:() => start({mode:"practice", title:"Мої помилки", pool:wrongIds().map(id => QBY[id])})}}, "Помилки (" + w + ")"),
        h("button", {class:"btn plain", disabled: !f, on:{click:() => start({mode:"practice", title:"Позначені", pool:flagIds().map(id => QBY[id])})}}, "Позначені (" + f + ")"))),
    h("h2", null, "Ситуаційні задачі"),
    h("p", {class:"muted small", style:"margin:0 0 10px"}, "Одна фабула і кілька питань з різних галузей та різних типів, як у кластерах на іспиті."),
    h("div", {class:"list"}, Object.keys(CTITLE).map(id => {
      const qs = Q.filter(q => q.c === id);
      const secs = [...new Set(qs.map(q => SEC[q.s].name))];
      return h("button", {class:"item", on:{click:() => start({mode:"practice", title:CTITLE[id], pool:qs})}},
        h("span", {class:"t"}, CTITLE[id]),
        h("span", {class:"n"}, qs.length + " " + pluralQ(qs.length)),
        h("span", {class:"n", style:"grid-column:1 / -1"}, secs.join(", ")));
    })),
    h("h2", null, "Розділи"),
    h("div", {class:"list"}, rows));
}
function sectionSheet(s){
  const all = Q.filter(q => q.s === s.id);
  const fresh = all.filter(q => !store.stats[q.id]);
  const bad = all.filter(q => store.stats[q.id] && store.stats[q.id].last === 0);
  const go = (pool, count) => start({mode:"practice", title:s.name, pool, count});
  openSheet(
    h("h3", null, s.name),
    h("div", {class:"stack"},
      h("button", {class:"btn", on:{click:() => go(all)}}, "Усі питання розділу (" + all.length + ")"),
      h("button", {class:"btn ghost", disabled: !fresh.length, on:{click:() => go(fresh)}}, "Лише нові (" + fresh.length + ")"),
      h("button", {class:"btn ghost", disabled: !bad.length, on:{click:() => go(bad)}}, "Лише помилки (" + bad.length + ")"),
      h("button", {class:"btn plain", on:{click:closeSheet}}, "Закрити")));
}

function examView(){
  const hist = store.exams.slice(0, 5);
  return h("div", null,
    h("h1", null, "Пробний іспит"),
    h("p", {class:"sub"}, "Без підказок, із таймером і оглядом питань. Розподіл питань за розділами відповідає питомій вазі в програмі МОН (наказ № 503 від 11.04.2024). Час розраховано як на іспиті: 90 секунд на завдання."),
    h("div", {class:"stack"},
      [15, 30, 60].filter((n, i) => n <= Q.length || i === 0).map(n =>
        h("button", {class:"btn" + (n === 30 ? "" : " ghost"), on:{click:() => start({mode:"exam", title:"Пробний іспит", pool:examPool(n)})}}, n + " " + pluralQ(n) + ", " + Math.round(n * 1.5) + " хв"))),
    h("p", {class:"small muted"}, "У тренажері зараз " + Q.length + " питань. Починаючи з 30 питань до іспиту додається одна ситуаційна задача (кластер) з її питаннями."),
    h("h2", null, "Останні спроби"),
    hist.length ? h("div", {class:"list", style:"padding:4px 16px"}, hist.map(e =>
      h("div", {class:"row"}, h("span", null, new Date(e.t).toLocaleDateString("uk-UA", {day:"numeric", month:"long"}) + ", " + e.n + " " + pluralQ(e.n)), h("span", {class:"pct"}, Math.round(e.c / e.n * 100) + "%")))) :
      h("p", {class:"muted", style:"margin:0"}, "Спроб ще не було. Почніть із 15 питань, щоб звикнути до формату."));
}

function progressView(){
  const rows = SECTIONS.map(s => {
    const st = secStats(s.id);
    return h("div", {class:"item", style:"cursor:default"},
      h("span", {class:"t"}, s.name),
      h("span", {class:st.acc == null ? "n" : "pct"}, st.acc == null ? "немає даних" : st.acc + "%"),
      h("div", {class:"bar"}, h("i", {style:"width:" + (st.acc || 0) + "%"})));
  });
  const seg = (val, label) => h("button", {"aria-pressed": store.theme === val ? "true" : "false", on:{click:() => { store.theme = val; save(); applyTheme(); render(); }}}, label);
  return h("div", null,
    h("h1", null, "Прогрес"),
    h("p", {class:"sub"}, "Точність за розділами рахується з усіх ваших відповідей. Дані зберігаються на цьому пристрої."),
    h("div", {class:"list"}, rows),
    h("h2", null, "Вигляд"),
    h("div", {class:"seg"}, seg("auto", "Авто"), seg("light", "Світла"), seg("dark", "Темна")),
    h("h2", null, "Про тренажер"),
    h("p", {class:"muted small", style:"margin:0 0 12px"}, "Завдання укладені як тренувальні й не є офіційними питаннями ЄДКІ. Закони змінюються, особливо в умовах воєнного стану, тож перед іспитом звіряйте норми з чинними редакціями та з програмою на сайті МОН. Якщо знайшли помилку у відповіді, перевірте текст норми, який вказано під кожним поясненням."),
    h("button", {class:"btn danger", on:{click:() => openSheet(
      h("h3", null, "Скинути прогрес?"),
      h("p", {class:"muted"}, "Буде видалено статистику, позначені питання та історію пробних іспитів на цьому пристрої."),
      h("div", {class:"stack"},
        h("button", {class:"btn danger", on:{click:() => { store.stats = {}; store.flags = {}; store.exams = []; save(); closeSheet(); }}}, "Скинути все"),
        h("button", {class:"btn plain", on:{click:closeSheet}}, "Скасувати")))}}, "Скинути прогрес"));
}

/* ===================== Екран питання ===================== */
function inputView(q, P, locked, a){
  const wrap = h("div");
  const set = v => { session.answers[q.id] = v; render(); };
  if (q.t === "single"){
    const box = h("div", {class:"opts"});
    P.opt.forEach((orig, j) => {
      let cls = "opt";
      if (locked){ if (orig === q.a[0]) cls += " ok"; else if (a === orig) cls += " bad"; }
      else if (a === orig) cls += " sel";
      box.append(h("button", {class:cls, disabled: locked, on:{click:() => {
        session.answers[q.id] = orig;
        if (session.mode === "practice") checkNow(q); else render();
      }}}, h("span", {class:"l"}, LETTERS[j]), h("span", null, q.o[orig])));
    });
    wrap.append(box);
  }
  if (q.t === "multi"){
    const sel = a || [], box = h("div", {class:"opts"});
    P.opt.forEach((orig, j) => {
      const on = sel.includes(orig), right = q.a.includes(orig);
      let cls = "opt";
      if (locked){ if (right && on) cls += " ok"; else if (right) cls += " miss"; else if (on) cls += " bad"; }
      else if (on) cls += " sel";
      box.append(h("button", {class:cls, disabled: locked, on:{click:() => {
        if (on) set(sel.filter(x => x !== orig));
        else if (sel.length < q.a.length) set(sel.concat(orig));
      }}}, h("span", {class:"l"}, LETTERS[j]), h("span", null, q.o[orig])));
    });
    wrap.append(box, h("p", {class:"hint", style:"margin:10px 0 0"}, "Обрано " + sel.length + " із " + q.a.length));
  }
  if (q.t === "order"){
    const placed = a || [];
    const seq = h("div", {class:"seq"});
    if (!placed.length) seq.append(h("div", {class:"empty"}, "Тут з’явиться ваша послідовність"));
    placed.forEach((orig, k) => seq.append(h("button", {class:"seqitem", disabled: locked, on:{click:() => set(placed.filter(x => x !== orig))}}, h("span", {class:"l"}, String(k + 1)), h("span", null, q.o[orig]))));
    wrap.append(seq);
    if (!locked){
      const pool = h("div", {class:"pool"});
      P.pool.filter(x => !placed.includes(x)).forEach(orig => pool.append(h("button", {class:"opt", on:{click:() => set(placed.concat(orig))}}, h("span", null, q.o[orig]))));
      wrap.append(pool);
    }
  }
  if (q.t === "match"){
    const cur = a || [];
    q.p.forEach((pr, i) => {
      const right = locked && cur[i] === pr[1];
      const row = h("div", {class:"mrow" + (locked ? (right ? " ok" : " bad") : "")}, h("p", null, pr[0]));
      const sel = h("select", {disabled: locked, "aria-label": pr[0], on:{change:e => { const n = (session.answers[q.id] || []).slice(); n[i] = e.target.value; set(n); }}},
        h("option", {value:""}, "Оберіть відповідь"),
        P.rights.map(r => h("option", {value:r, selected: cur[i] === r}, r)));
      row.append(sel);
      if (locked && !right) row.append(h("div", {class:"right"}, "Правильно: " + pr[1]));
      wrap.append(row);
    });
  }
  return wrap;
}
function feedbackView(q, a){
  const ok = isCorrect(q, a);
  const kids = [h("div", {class:"verdict " + (ok ? "ok" : "bad")}, a == null && session.review ? "Правильна відповідь" : ok ? "Правильно" : "Неправильно")];
  if (q.t === "order" && !ok){
    kids.push(h("p", {class:"small muted", style:"margin:0 0 8px"}, "Правильна послідовність:"));
    const seq = h("div", {class:"seq"});
    q.o.forEach((t, k) => seq.append(h("div", {class:"seqitem"}, h("span", {class:"l"}, String(k + 1)), h("span", null, t))));
    kids.push(seq);
  }
  if (q.n) kids.push(h("div", {class:"norm"}, h("b", null, "Текст норми, " + q.b + " (звірте з чинною редакцією)"), h("p", null, "«" + q.n + "»")));
  kids.push(h("p", {class:"expl"}, q.e), h("div", {class:"basis"}, "Підстава: " + q.b));
  return h("div", null, kids);
}

function quizView(){
  const s = session, q = s.qs[s.i], P = prep(q), exam = s.mode === "exam";
  const a = s.answers[q.id], locked = !!s.checked[q.id];
  const last = s.i === s.qs.length - 1;
  const left = exam ? Math.round((s.endsAt - Date.now()) / 1000) : 0;

  const top = h("div", {class:"qtop"},
    h("div", {class:"qbar"},
      h("button", {class:"iconbtn", "aria-label":"Вийти", on:{click:() => exit()}}, icon("close")),
      h("div", {class:"qcount"}, (s.i + 1) + " із " + s.qs.length),
      exam ? h("span", {class:"timer" + (left <= 300 ? " low" : ""), id:"timer"}, fmtTime(left)) : h("span"),
      h("button", {class:"iconbtn", "aria-label":"Позначити питання", "aria-pressed": store.flags[q.id] ? "true" : "false", on:{click:() => { if (store.flags[q.id]) delete store.flags[q.id]; else store.flags[q.id] = 1; save(); render(); }}}, icon("flag"))),
    h("div", {class:"prog"}, h("i", {style:"width:" + Math.round((s.i + (locked ? 1 : 0)) / s.qs.length * 100) + "%"})));

  const body = h("div", {class:"qwrap"},
    h("div", {class:"sec"}, SEC[q.s].name),
    q.c ? h("div", {class:"fabula"}, h("b", null, "Фабула"), CLUSTERS[q.c]) : null,
    h("p", {class:"qtext"}, q.q),
    h("p", {class:"hint"}, hintText(q)),
    inputView(q, P, locked, a),
    locked ? feedbackView(q, a) : null);

  let bar;
  if (exam){
    bar = h("div", {class:"actions"}, h("div", {class:"in"},
      h("button", {class:"btn ghost", disabled: s.i === 0, on:{click:() => go(-1)}}, "Назад"),
      h("button", {class:"btn plain", "aria-label":"Огляд питань", on:{click:overview}}, icon("grid")),
      last ? h("button", {class:"btn", on:{click:confirmFinish}}, "Завершити") : h("button", {class:"btn", on:{click:() => go(1)}}, "Далі")));
  } else if (!locked){
    bar = h("div", {class:"actions"}, h("div", {class:"in"},
      q.t === "single" ? h("button", {class:"btn plain", disabled:true}, "Оберіть відповідь") :
      h("button", {class:"btn", disabled: !ready(q, a), on:{click:() => checkNow(q)}}, "Перевірити")));
  } else {
    bar = h("div", {class:"actions"}, h("div", {class:"in"},
      h("button", {class:"btn", on:{click:() => last ? finish() : go(1)}}, last ? "Завершити" : "Далі")));
  }
  return h("div", null, top, body, bar);
}
function go(d){ session.i = Math.min(session.qs.length - 1, Math.max(0, session.i + d)); render(); window.scrollTo(0, 0); }
function overview(){
  const s = session;
  openSheet(h("h3", null, "Огляд питань"),
    h("div", {class:"grid"}, s.qs.map((q, i) => h("button", {class:"cell" + (hasAns(q) ? " done" : "") + (i === s.i ? " cur" : "") + (store.flags[q.id] ? " fl" : ""), on:{click:() => { s.i = i; closeSheet(); window.scrollTo(0,0); }}}, String(i + 1)))),
    h("p", {class:"small muted"}, "Зелені питання мають відповідь, підкреслені позначено для повернення."),
    h("div", {class:"stack"}, h("button", {class:"btn", on:{click:confirmFinish}}, "Завершити іспит"), h("button", {class:"btn plain", on:{click:closeSheet}}, "Повернутися")));
}
function confirmFinish(){
  const left = session.qs.filter(q => !hasAns(q)).length;
  openSheet(h("h3", null, "Завершити іспит?"),
    h("p", {class:"muted"}, left ? "Без відповіді залишилось " + left + " " + pluralQ(left) + ". Вони будуть зараховані як неправильні." : "Усі питання мають відповіді."),
    h("div", {class:"stack"}, h("button", {class:"btn", on:{click:finish}}, "Завершити"), h("button", {class:"btn plain", on:{click:closeSheet}}, "Повернутися до іспиту")));
}
function exit(){
  if (session.done) return leave();
  openSheet(h("h3", null, "Вийти з тренування?"),
    h("p", {class:"muted"}, session.mode === "exam" ? "Результат пробного іспиту не збережеться." : "Відповіді, які ви вже перевірили, збережені в прогресі."),
    h("div", {class:"stack"}, h("button", {class:"btn danger", on:{click:leave}}, "Вийти"), h("button", {class:"btn plain", on:{click:closeSheet}}, "Залишитись")));
}

/* ===================== Результат ===================== */
function resultView(){
  const s = session, r = score(s), exam = s.mode === "exam";
  const pct = r.total ? Math.round(r.ok / r.total * 100) : 0;
  const mins = Math.max(1, Math.round((Date.now() - s.startedAt) / 60000));
  const bySec = {};
  s.qs.forEach(q => { if (exam || s.checked[q.id]){ const o = bySec[q.s] || (bySec[q.s] = {n:0, c:0}); o.n++; if (isCorrect(q, s.answers[q.id])) o.c++; } });
  return h("main", {class:"app"},
    h("h1", null, exam ? "Результат іспиту" : "Підсумок"),
    h("p", {class:"sub"}, s.title),
    h("div", {class:"big"}, pct + "%"),
    h("p", {class:"muted", style:"margin:0 0 18px"}, r.ok + " із " + r.total + " правильних" + (exam ? ", " + mins + " хв" : "")),
    Object.keys(bySec).length ? h("div", {class:"list", style:"padding:4px 16px;margin-bottom:18px"}, Object.entries(bySec).map(([id, o]) => h("div", {class:"row"}, h("span", null, SEC[id].name), h("span", {class:"pct"}, o.c + " із " + o.n)))) : null,
    h("div", {class:"stack"},
      r.wrong.length ? h("button", {class:"btn", on:{click:() => reviewWrong(r.wrong)}}, "Розібрати помилки (" + r.wrong.length + ")") : null,
      h("button", {class:r.wrong.length ? "btn ghost" : "btn", on:{click:leave}}, "На головну")));
}
function reviewWrong(list){
  clearInterval(tick);
  session = {mode:"practice", title:"Розбір помилок", qs:list, i:0, answers:{}, checked:{}, prep:{}, startedAt:Date.now(), done:false, review:true};
  list.forEach(q => { session.checked[q.id] = true; });
  render(); window.scrollTo(0, 0);
}

/* ===================== Рендер ===================== */
const root = document.getElementById("root");
function render(){
  const y = window.scrollY;
  root.replaceChildren();
  if (session) root.append(session.done ? resultView() : quizView());
  else root.append(mainView(), tabbar());
  if (sheet) root.append(sheet);
  if (session && !session.done) window.scrollTo(0, y);
}
render();

/* Іконка для екрана «Додому» на iPhone */
try {
  const c = document.createElement("canvas"); c.width = c.height = 180;

  g.fillStyle = "#F3EAD3"; g.font = "600 110px Georgia, serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("§", 90, 96);

  document.head.appendChild(l);
